<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>WordMate</title>
</head>

<body>
  <!--
  주제 변경 사유: 웹 개발을 처음 배우는 단계에서 다양한 UI/UX를 구현해보는 면에서 영어 단어 학습 서비스가 더 적합하다고 생각하여 주제를 변경하게 되었습니다.
  사용자 : 영어 공부를 하고싶은 직장인 및 학생
  목적 : 매일 부담없는 분량의 영어단어를 학습하고 테스트하면서 영어학습 습관을 형성할 수 있는 환경을 제공한다.
  핵심 행동 : 영어 단어 학습하기
  정보 순서 : 서비스 소개 -> 주요 기능 -> 이용 방법 -> 문의 사항
  -->

  <header>
    <h1>영어 학습 서비스</h1>
    <p>영어 단어를 학습하고 테스트하면서 영어학습 습관을 형성할 수 있는 환경을 제공합니다.</p>
  </header>

  <h2>서비스 소개</h2>
  <h3>제공되는 영어 단어 및 테스트를 통해 영어 실력을 늘릴 수 있는 서비스</h3>
</body>

</html>
